      "text": "Once activated or triggered, an ability exists on the stack independently of its source. Destruction or removal of the source after that time won’t affect the ability. Note that some abilities cause a source to do something (for example, “This creature deals 1 damage to any target”) rather than the ability doing anything directly. In these cases, any activated or triggered ability that references information about the source for use while announcing an activated ability or putting a triggered ability on the stack checks that information when the ability is put onto the stack. Otherwise, it will check that information when it resolves. In both instances, if the source is no longer in the zone it’s expected to be in at that time, its last known information is used. The source can still perform the action even though it no longer exists."
    }
  ],
  "rulings": [
    {
      "id": "dc-2008-whole-library",
      "card": "demonic-consultation",
      "date": "2008-10-01",
      "source": "wotc",
      "text": "If you don't reveal the named card (perhaps because it was in the top six cards of your library), you'll end up exiling your entire library. You don't lose the game at that point, but will lose the next time you're instructed to draw a card.",
      "links": [
        {
          "label": "Gatherer",
          "url": "https://gatherer.wizards.com/Pages/Card/Details.aspx?multiverseid=2445"
        }
      ]
    },
    {
      "id": "dc-2008-name-on-resolution",
      "card": "demonic-consultation",
      "date": "2008-10-01",
      "source": "wotc",
      "text": "You don't name a card until Demonic Consultation resolves."
    },
    {
      "id": "to-2020-devotion-zero",
      "card": "thassas-oracle",
      "date": "2020-01-24",
      "source": "wotc",
      "text": "If your devotion to blue is zero at the time the triggered ability of Thassa's Oracle resolves, you don't look at or move any cards in your library."
    },
    {
      "id": "to-2020-devotion-count",
      "card": "thassas-oracle",
      "date": "2020-01-24",
      "source": "wotc",
      "text": "If an activated ability or triggered ability has an effect that depends on your devotion to a color, you count the number of mana symbols of that color among the mana costs of permanents you control as the ability resolves."
    }
  ],
  "steps": [
    {
      "text": "[[card:Demonic Consultation]] resolves. You name a card as it resolves ([[ruling:dc-2008-name-on-resolution]]), exile the top six cards, then reveal until the named card appears. If it never appears, your whole library is exiled.",
      "note": "Naming a card you know isn't in the library is the usual way to do this on purpose."
    },
    {
      "text": "Having an empty library is not a loss. The state-based action in [[rule:704.5b]] (and [[rule:121.4]]) applies only when a player *attempted to draw* from an empty library. The 2008 ruling says the same thing in plain words: [[ruling:dc-2008-whole-library]]."
    },
    {
      "text": "You cast [[card:Thassa's Oracle]]. It resolves, enters the battlefield, and its ability triggers ([[rule:603.2]]) and goes on the stack the next time a player would receive priority ([[rule:603.3]])."
    },
    {
      "text": "Your opponent kills the Oracle in response. The trigger is already on the stack as an object independent of its source and still resolves ([[rule:113.7a]]). Your devotion to blue is counted as the ability resolves ([[ruling:to-2020-devotion-count]]), so with the Oracle gone X may be 0."
    },
    {
      "text": "The trigger resolves. With X = 0 you look at nothing ([[ruling:to-2020-devotion-zero]]), but the last sentence still applies: 0 is greater than or equal to 0 cards in your library, so you win the game.",
      "note": "Ways to actually stop this: counter the Oracle, counter or exile the trigger (Stifle effects), or put cards into the library before the trigger resolves."
    }
  ],
  "reddit": {
    "searched": true,
    "threads": [],
    "overview": "Reddit could not be fetched from this environment, so no threads are summarised here. The link below runs the search in your own browser.",
    "opinions": [],
    "agreesWithOfficial": "unknown",
    "searchUrl": "https://www.reddit.com/r/mtgrules/search/?q=%22Thassa%27s+Oracle%22+%22Demonic+Consultation%22"
  }
}
</script>

<script>
/* ===== 3. ANSWER DATA is the JSON block above (id="answer-data").
   Claude replaces its contents for each answer; the schema is documented
   in references/answer-schema.md. Inline references inside any text:
     [[card:Card Name or id]]   [[rule:704.5b]]   [[ruling:ruling-id]]
     [[link:Label|https://...]]
   Mana symbols like {U}, {2}, {U/B}, {T} render as symbols anywhere. */
const ANSWER = JSON.parse(document.getElementById("answer-data").textContent);
const L = CONFIG.labels[ANSWER.lang] || CONFIG.labels.en;

/* ===== 4. RENDERERS — one function per block of the page ===== */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

const cardById = {};
(ANSWER.cards || []).forEach((c) => { c.id = c.id || slug(c.name); cardById[c.id] = c; cardById[slug(c.name)] = c; });
const ruleById = Object.fromEntries((ANSWER.rules || []).map((r) => [r.id, r]));
const rulingById = Object.fromEntries((ANSWER.rulings || []).map((r) => [r.id, r]));

function mana(text) {
  // {U} {2} {X} {U/B} {2/W} {T} {Q} {E} {S} -> symbol spans
  return text.replace(/\{([^}]{1,4})\}/g, (m, sym) => {
    const s = sym.toUpperCase();
    if (s.includes("/")) {
      const [a, b] = s.split("/");
      const col = { W: "#F8F6D8", U: "#C1D7E9", B: "#BAB1AB", R: "#E49977", G: "#A3C095" };
      const ca = col[a] || "#CAC5C0", cb = col[b] || "#CAC5C0";
      return `<span class="ms ms-hybrid" style="--h1:${ca};--h2:${cb}" title="${esc(m)}">${esc(a)}/${esc(b)}</span>`;
    }
    const cls = /^[WUBRGC]$/.test(s) ? "ms-" + s : s === "T" ? "ms-T" : "";
    const label = s === "T" ? "⟳" : s;
    return `<span class="ms ${cls}" title="${esc(m)}">${esc(label)}</span>`;
  });
}

function inline(text) {
  // escape, then light markup, then [[refs]], then mana symbols
  let h = esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\[\[(card|rule|ruling|link):([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, kind, key, label) => {
    const unesc = (x) => x.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
    key = unesc(key.trim()); if (label) label = unesc(label);
    if (kind === "link") return `<a href="${esc(label || key)}" target="_blank" rel="noopener">${esc(key)}</a>`;
    if (kind === "card") {
      const c = cardById[key] || cardById[slug(key)];
      if (!c) return `<span class="ref ref-missing" title="${esc(L.missingRef)}">${esc(label || key)}</span>`;
      return `<button type="button" class="ref ref-card" data-kind="card" data-key="${esc(c.id)}" aria-expanded="false">${esc(label || c.name)}</button>`;
    }
    if (kind === "rule") {
      const r = ruleById[key];
      if (!r) return `<span class="ref ref-missing" title="${esc(L.missingRef)}">${esc(label || "CR " + key)}</span>`;
      return `<button type="button" class="ref ref-rule" data-kind="rule" data-key="${esc(key)}" aria-expanded="false">${esc(label || "CR " + key)}</button>`;
    }
    const r = rulingById[key];
    if (!r) return `<span class="ref ref-missing" title="${esc(L.missingRef)}">${esc(label || key)}</span>`;
    const card = cardById[r.card];
    const lbl = label || `${L.ruling.toLowerCase()} ${card ? card.name + ", " : ""}${r.date}`;
    return `<button type="button" class="ref ref-ruling" data-kind="ruling" data-key="${esc(key)}" aria-expanded="false">${esc(lbl)}</button>`;
  });
  return mana(h);
}
const paras = (text) => String(text ?? "").split(/\n{2,}/).map((p) => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("");

function frameClass(c) {
  const cols = c.colors || [];
  const type = (c.typeLine || "").toLowerCase();
  if (cols.length > 1) return "frame-M";
  if (cols.length === 1) return "frame-" + cols[0];
  if (type.includes("land")) return "frame-L";
  if (type.includes("artifact")) return "frame-A";
  return "frame-C";
}

function cardFrame(c, opts = {}) {
  const faces = c.faces && c.faces.length ? c.faces : [c];
  const f = faces[0];
  const pt = f.power != null ? `${esc(f.power)}/${esc(f.toughness)}` : f.loyalty != null ? esc(f.loyalty) : f.defense != null ? esc(f.defense) : "";
  const extraFaces = faces.slice(1).map((x) => `<hr style="border:0;border-top:1px solid rgba(0,0,0,.3);margin:6px 0"><b>${esc(x.name)}</b> ${mana(esc(x.manaCost || ""))}<br><i>${esc(x.typeLine || "")}</i>${paras(x.oracleText)}`).join("");
  const img = CONFIG.tryExternalImages && (c.imageDataUri || c.imageUrl)
    ? `<img class="art" alt="" src="${esc(c.imageDataUri || c.imageUrl)}" onload="this.parentElement.classList.add('has-image')" onerror="this.remove()">` : "";
  const tag = c.note ? `<span class="tag">${esc(c.note)}</span>` : "";
  const href = c.scryfallUri || CONFIG.cardSearchLink(c.name);
  return `<a class="cardframe ${frameClass(c)}" href="${esc(href)}" target="_blank" rel="noopener" title="${esc(L.openOn)} Scryfall">${tag}${img}
    <div class="inner">
      <div class="bar"><span class="name">${esc(f.name || c.name)}</span><span class="cost">${mana(esc(f.manaCost || c.manaCost || ""))}</span></div>
      <div class="bar type"><span>${esc(f.typeLine || c.typeLine || "")}</span></div>
      <div class="box">${paras(f.oracleText || c.oracleText)}${extraFaces}${pt ? `<div class="pt">${pt}</div>` : ""}</div>
    </div></a>`;
}

function renderHeader() {
  const demo = ANSWER.demo ? `<div class="demo-banner">Sample answer, to show the layout. Card text and rulings were retrieved from mtg.wtf on ${esc(ANSWER.generatedAt)}; rules are quoted verbatim from the Comprehensive Rules effective ${esc(ANSWER.crEffectiveDate)}.</div>` : "";
  return `${demo}<header>
    <div class="eyebrow">${esc(L.kicker)}</div>
    <h1>${esc(ANSWER.title)}</h1>
    ${ANSWER.question ? `<div class="question">${paras(ANSWER.question)}</div>` : ""}
    <div class="meta">
      <span>${esc(L.crVersion)} <b>${esc(ANSWER.crEffectiveDate || "?")}</b></span>
      <span>${esc(L.generated)} <b>${esc(ANSWER.generatedAt || "")}</b></span>
    </div>
  </header>`;
}

function renderNav() {
  const N = L.nav;
  const items = [["answer", N.answer], ["cards", N.cards], ["rules", N.rules], ["rulings", N.rulings], ["walkthrough", N.walkthrough], ["confidence", N.confidence]];
  if (ANSWER.reddit) items.push(["community", N.community, "unofficial-link"]);
  return `<nav class="sections"><ul>${items.map(([id, label, cls]) => `<li><a href="#${id}" class="${cls || ""}">${esc(label)}</a></li>`).join("")}</ul></nav>`;
}

function renderAnswer() {
  const lvl = (ANSWER.confidence && ANSWER.confidence.level) || "medium";
  return `<section id="answer"><h2>${esc(L.shortAnswer)}</h2>
    <div class="verdict"><div class="text">${paras(ANSWER.shortAnswer)}</div><span class="pill ${esc(lvl)}">${esc(L.confidence)}: ${esc(L[lvl] || lvl)}</span></div></section>`;
}

function renderCards() {
  const cards = ANSWER.cards || [];
  if (!cards.length) return "";
  return `<section id="cards"><h2>${esc(L.cards)} <span class="count">${cards.length}</span></h2>
    <div class="cards-grid">${cards.map((c) => cardFrame(c)).join("")}</div>
    ${ANSWER.allCardsLink ? `<p class="cards-foot"><a href="${esc(ANSWER.allCardsLink)}" target="_blank" rel="noopener">${esc(L.allCards)} →</a></p>` : ""}</section>`;
}

function ruleBody(text) {
  // "Example:" lines in the CR are set apart in italics, as in the printed rules
  return String(text ?? "").split("\n").map((line) => /^\s*Example:/i.test(line) ? `<span class="ex">${inline(line)}</span>` : inline(line)).join("<br>");
}

function renderRules() {
  const rules = ANSWER.rules || [];
  if (!rules.length) return "";
  return `<section id="rules"><h2>${esc(L.rules)} <span class="count">${rules.length}</span></h2>
    ${rules.map((r) => `<div class="quote" id="rule-${esc(slug(r.id))}"><div class="key"><a href="${esc(CONFIG.ruleLink(r.id))}" target="_blank" rel="noopener">${esc(r.id)}</a></div><div class="body">${ruleBody(r.text)}</div></div>`).join("")}</section>`;
}

function rulingSrc(r) {
  return r.source === "wotc" ? `<span class="src">${esc(L.official)}</span>` : `<span class="src scryfall">${esc(r.sourceLabel || L.scryfallNote)}</span>`;
}

function renderRulings() {
  const rulings = ANSWER.rulings || [];
  if (!rulings.length) return "";
  const groups = {};
  rulings.forEach((r) => { (groups[r.card] = groups[r.card] || []).push(r); });
  return `<section id="rulings"><h2>${esc(L.rulings)} <span class="count">${rulings.length}</span></h2>
    ${Object.entries(groups).map(([cid, rs]) => { const c = cardById[cid]; return `<div class="ruling-group"><h3>${esc(c ? c.name : cid)}</h3>
      ${rs.map((r) => `<div class="quote ruling" id="ruling-${esc(slug(r.id))}"><div class="key"><span>${esc(r.date || "")}</span>${rulingSrc(r)}</div><div class="body">${paras(r.text)}${(r.links || []).length ? `<div class="pop-links">${r.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("")}</div>` : ""}</div></div>`).join("")}</div>`; }).join("")}</section>`;
}

function renderSteps() {
  const steps = ANSWER.steps || [];
  if (!steps.length) return "";
  return `<section id="walkthrough"><h2>${esc(L.walkthrough)}</h2><ol class="steps">${steps.map((s) => `<li><div class="step">${paras(s.text)}${s.note ? `<div class="note">${inline(s.note)}</div>` : ""}</div></li>`).join("")}</ol></section>`;
}

function renderConfidence() {
  const c = ANSWER.confidence;
  if (!c) return "";
  const panel = (title, items) => items && items.length ? `<div class="panel"><h3>${esc(title)}</h3><ul>${items.map((i) => `<li>${inline(i)}</li>`).join("")}</ul></div>` : "";
  return `<section id="confidence"><h2>${esc(L.confidence)} <span class="pill ${esc(c.level)}">${esc(L[c.level] || c.level)}</span></h2>
    <div class="confidence">${panel(L.why, c.reasons)}${panel(L.assumptions, c.assumptions)}${panel(L.notRetrieved, c.notRetrieved)}</div></section>`;
}

function renderCommunity() {
  const r = ANSWER.reddit;
  if (!r) return "";
  const agreeMap = { yes: ["high", L.yes], partly: ["medium", L.partly], no: ["low", L.no] };
  const [cls, txt] = agreeMap[r.agreesWithOfficial] || ["", L.unknown];
  const threads = (r.threads || []).length
    ? `<ul class="threads">${r.threads.map((t) => `<li><div class="t-head"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a><span>${esc(t.subreddit || "")}</span><span>${esc(t.date || "")}</span>${t.comments != null ? `<span>${esc(t.comments)} comments</span>` : ""}${t.judgeFlair ? `<span class="src">judge</span>` : ""}</div>${t.summary ? `<div class="t-sum">${inline(t.summary)}</div>` : ""}</li>`).join("")}</ul>`
    : r.searched === false ? "" : `<p class="muted">${esc(L.noThreads)}</p>`;
  const search = r.searchUrl ? `<p><a href="${esc(r.searchUrl)}" target="_blank" rel="noopener">${esc(L.searchReddit)} →</a></p>` : "";
  return `<section id="community" class="community"><div class="eyebrow">${esc(L.communityKicker)}</div><h2>${esc(L.community)}</h2>
    ${r.threads && r.threads.length ? `<div class="agree">${esc(L.agrees)} <span class="pill ${cls}">${esc(txt)}</span></div>` : ""}
    ${r.overview ? paras(r.overview) : ""}
    ${(r.opinions || []).length ? `<div class="eyebrow" style="margin-top:12px">${esc(L.opinions)}</div><ul class="opinions">${r.opinions.map((o) => `<li>${inline(o)}</li>`).join("")}</ul>` : ""}
    ${threads}${r.notes ? `<p class="muted" style="margin-top:10px">${inline(r.notes)}</p>` : ""}${search}</section>`;
}

function renderFooter() {
  const srcs = [...new Set((ANSWER.cards || []).map((c) => c.source).filter(Boolean))];
  return `<footer>${esc(L.footer)}${srcs.length ? ` <span class="mono">${esc(srcs.join(" · "))}</span>` : ""}</footer>`;
}

document.getElementById("app").innerHTML = [renderHeader(), renderNav(), renderAnswer(), renderCards(), renderRules(), renderRulings(), renderSteps(), renderConfidence(), renderCommunity(), renderFooter()].join("");

/* ===== 5. POPOVER ENGINE — hover, focus, click-to-pin, keyboard ===== */
(function () {
  const pop = document.getElementById("pop");
  let current = null, pinned = false, showTimer = null, hideTimer = null;

  function content(kind, key) {
    if (kind === "card") {
      const c = cardById[key];
      return `<div class="pop-head"><span class="pop-title">${esc(c.name)}</span><span class="pop-kind">${esc(L.card)}</span></div>${cardFrame(c)}
        <div class="pop-links"><a href="${esc(c.scryfallUri || CONFIG.cardSearchLink(c.name))}" target="_blank" rel="noopener">${esc(L.openOn)} Scryfall →</a>${(c.links || []).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("")}</div>`;
    }
    if (kind === "rule") {
      const r = ruleById[key];
      return `<div class="pop-head"><span class="pop-title mono">${esc(r.id)}</span><span class="pop-kind">${esc(L.rule)} · CR ${esc(ANSWER.crEffectiveDate || "")}</span></div><div class="pop-body">${ruleBody(r.text)}</div>
        <div class="pop-links"><a href="#rule-${esc(slug(r.id))}">↓ ${esc(L.rules)}</a><a href="${esc(CONFIG.ruleLink(r.id))}" target="_blank" rel="noopener">magic.wizards.com →</a></div>`;
    }
    const r = rulingById[key];
    const c = cardById[r.card];
    return `<div class="pop-head"><span class="pop-title">${esc(c ? c.name : r.card)}</span><span class="pop-kind">${esc(L.ruling)} · ${esc(r.date || "")}</span></div>${rulingSrc(r)}<div class="pop-body" style="margin-top:6px">${paras(r.text)}</div>
      <div class="pop-links"><a href="#ruling-${esc(slug(r.id))}">↓ ${esc(L.rulings)}</a>${(r.links || []).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("")}${c && c.scryfallUri ? `<a href="${esc(c.scryfallUri)}" target="_blank" rel="noopener">Scryfall →</a>` : ""}</div>`;
  }

  function place(trigger) {
    const r = trigger.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    let top = r.bottom + 8;
    if (top + ph > vh - 8 && r.top - ph - 8 > 8) top = r.top - ph - 8;
    top = Math.max(8, Math.min(top, vh - ph - 8));
    let left = r.left + r.width / 2 - pw / 2;
    left = Math.max(12, Math.min(left, vw - pw - 12));
    pop.style.top = top + "px"; pop.style.left = left + "px";
  }

  function open(trigger) {
    clearTimeout(hideTimer);
    if (current && current !== trigger) current.setAttribute("aria-expanded", "false");
    current = trigger;
    pop.innerHTML = content(trigger.dataset.kind, trigger.dataset.key) + `<div class="pin-hint">${esc(L.pinHint)}</div>`;
    pop.classList.add("show");
    trigger.setAttribute("aria-expanded", "true");
    place(trigger);
  }
  function close() {
    clearTimeout(showTimer); clearTimeout(hideTimer);
    pop.classList.remove("show"); pinned = false;
    if (current) current.setAttribute("aria-expanded", "false");
    current = null;
  }
  function scheduleHide() { if (pinned) return; clearTimeout(hideTimer); hideTimer = setTimeout(close, CONFIG.hideDelayMs); }

  document.addEventListener("pointerover", (e) => {
    const t = e.target.closest(".ref[data-kind]");
    if (t) { if (e.pointerType === "touch") return; clearTimeout(hideTimer); if (pinned && current !== t) return; clearTimeout(showTimer); showTimer = setTimeout(() => open(t), CONFIG.hoverDelayMs); }
  });
  document.addEventListener("pointerout", (e) => {
    const t = e.target.closest(".ref[data-kind]");
    if (t) { clearTimeout(showTimer); if (!pop.contains(e.relatedTarget)) scheduleHide(); }
  });
  pop.addEventListener("pointerenter", () => clearTimeout(hideTimer));
  pop.addEventListener("pointerleave", () => scheduleHide());
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".ref[data-kind]");
    if (t) { e.preventDefault(); if (current === t && pinned) { close(); } else { open(t); pinned = true; } return; }
    if (!pop.contains(e.target)) close();
  });
  document.addEventListener("focusin", (e) => { const t = e.target.closest(".ref[data-kind]"); if (t && !pinned) open(t); });
  document.addEventListener("focusout", (e) => { if (e.target.closest(".ref[data-kind]") && !pinned) scheduleHide(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  window.addEventListener("scroll", () => { if (current) place(current); }, { passive: true });
  window.addEventListener("resize", () => { if (current) place(current); });

  // highlight the section in view in the sticky nav
  const links = [...document.querySelectorAll("nav.sections a")];
  const secs = links.map((a) => document.querySelector(a.getAttribute("href"))).filter(Boolean);
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => { if (en.isIntersecting) links.forEach((a) => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id)); });
    }, { rootMargin: "-20% 0px -70% 0px" });
    secs.forEach((s) => io.observe(s));
  }
})();
</script>
