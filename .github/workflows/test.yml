name: Tests

# Code changes. The daily data update has its own workflow (update.yml), which runs
# only the data-independent checks before it ships.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Evidence scripts (card resolution, rule search, build.py refusals)
        run: python tests/test_lookup.py

      - name: Share link and viewer
        run: |
          python tests/make_fixtures.py
          python tests/test_share.py
          node tests/test_decode.mjs
          node tests/test_reddit.mjs
